name: Cloudsmith setup tests
on:
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: cloudsmith-setup-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # Do not execute pull-request code from a fork on a runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_*cloudsmith*.py' -v
      # Lint this repository's own workflows with the pull request's copy.
      - run: python3 .github/actions/cloudsmith-ci-lint/cloudsmith_ci_lint.py --root . --mode warn
