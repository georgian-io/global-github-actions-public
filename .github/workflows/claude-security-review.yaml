name: Claude Security Review (Reusable)

# Reusable workflow — call from any repo via:
#
#   uses: georgian-io/global-github-actions-public/.github/workflows/claude-security-review.yaml@main
#   secrets:
#     CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#
# Runs a dedicated security-focused review on every PR, separate from the general code review.
# The calling repo must have CLAUDE_CODE_OAUTH_TOKEN set as a repo or org secret.

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

concurrency:
  group: claude-security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-security-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Get current date
        id: date
        run: echo "TODAY=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Run Claude Security Review
        uses: anthropics/claude-code-action@df37d2f0760a4b5683a6e617c9325bc1a36443f6 # v1.0.75
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            CURRENT DATE: ${{ steps.date.outputs.TODAY }}

            Perform a focused SECURITY review of this pull request. This is separate from
            the general code review — focus exclusively on security concerns.

            Check for:

            **Secrets & Credentials**
            - Hardcoded API keys, tokens, passwords, private keys
            - Secrets committed to the repository (even in test/fixture files)
            - Overly broad scopes on tokens or service accounts

            **Authentication & Authorization**
            - Missing or bypassable auth checks
            - Insecure session management
            - Privilege escalation paths

            **Injection & Input Validation**
            - SQL/NoSQL injection
            - Command injection (especially in CI/CD scripts)
            - Template injection (SSTI)
            - Path traversal

            **Dependency Security**
            - New dependencies with known CVEs
            - Unpinned versions in CI workflows (use commit SHAs)
            - Supply chain risks (typosquatting, dependency confusion)

            **Infrastructure & Cloud**
            - Overly permissive IAM roles or policies
            - Publicly exposed resources that should be private
            - Unencrypted data at rest or in transit
            - Insecure defaults in cloud config

            **CI/CD Security**
            - Untrusted input used in `run:` steps (script injection risk)
            - Workflow permissions broader than needed
            - Third-party actions not pinned to a commit SHA
            - Secrets passed to untrusted forks

            **Data Handling**
            - PII or sensitive data logged or exposed
            - Insecure deserialization
            - Missing data validation or sanitization

            Risk levels: 🔴 Critical (immediate action required) | 🟠 High | 🟡 Medium | 🟢 Low (informational)

            RESPONSE FORMAT:
            - If NO security issues found: post a brief "✅ Security review passed — no issues found." comment
            - If issues found: provide a structured report grouped by risk level

            COMMENT INSTRUCTIONS:
            Write your review to /tmp/security-review.md with "<!-- claude-security-review -->"
            at the very beginning, then:
            1. Search for existing comment:
               `gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
                 --jq '.[] | select(.body | contains("<!-- claude-security-review -->")) | .id'`
            2. Update if found:
               `gh api repos/${{ github.repository }}/issues/comments/<ID> -X PATCH -F body=@/tmp/security-review.md`
            3. Create if not found:
               `gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/security-review.md`

          claude_args: >-
            --allowed-tools
            "Read,Glob,Grep,
            Bash(gh api:*),
            Bash(gh pr comment:*),
            Bash(gh pr diff:*),
            Bash(gh pr view:*),
            Bash(git diff:*),
            Bash(git log:*),
            Bash(git show:*)"
