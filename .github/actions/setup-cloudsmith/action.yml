name: Set up Cloudsmith
description: Authenticate one repository and configure package managers.

inputs:
  npm-repository:
    description: Cloudsmith repository for npm-compatible clients.
    required: false
    default: ""
  python-repository:
    description: Cloudsmith repository for Python clients.
    required: false
    default: ""

outputs:
  service-slug:
    description: Cloudsmith service slug used by this job.
    value: ${{ steps.identity.outputs.service-slug }}

runs:
  using: composite
  steps:
    - name: Select the repository identity
      id: identity
      shell: bash
      run: |
        set -euo pipefail
        repository="${GITHUB_REPOSITORY#*/}"
        candidate="ci-pull-${repository,,}"
        candidate="$(printf '%s' "$candidate" | tr -cs 'a-z0-9-' '-' | sed 's/^-//;s/-$//')"
        if (( ${#candidate} > 64 )); then
          digest="$(printf '%s' "$candidate" | sha256sum | cut -c1-8)"
          candidate="${candidate:0:55}"
          while [[ "$candidate" == *- ]]; do
            candidate="${candidate%-}"
          done
          candidate="${candidate}-${digest}"
        fi
        service_slug="$candidate"
        if [[ ! "$service_slug" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]; then
          echo "Invalid Cloudsmith service slug: $service_slug" >&2
          exit 1
        fi
        echo "service-slug=$service_slug" >> "$GITHUB_OUTPUT"

    - name: Authenticate to Cloudsmith
      uses: cloudsmith-io/cloudsmith-cli-action@69e169e2ad9bc9a1599c2dff464061a00fe9f8ba # v3.1.1
      with:
        cli-version: "1.27.0"
        oidc-namespace: georgian
        oidc-service-slug: ${{ steps.identity.outputs.service-slug }}
        export-auth-token: "true"

    - name: Configure package clients
      shell: bash
      env:
        NPM_REPOSITORY: ${{ inputs.npm-repository }}
        PYTHON_REPOSITORY: ${{ inputs.python-repository }}
      run: |
        set -euo pipefail
        if [[ -z "$NPM_REPOSITORY" && -z "$PYTHON_REPOSITORY" ]]; then
          echo "Set npm-repository or python-repository." >&2
          exit 1
        fi

        for repository in "$NPM_REPOSITORY" "$PYTHON_REPOSITORY"; do
          if [[ -n "$repository" && ! "$repository" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Invalid Cloudsmith repository slug: $repository" >&2
            exit 1
          fi
        done

        config_dir="$RUNNER_TEMP/cloudsmith"
        mkdir -p "$config_dir"

        if [[ -n "$NPM_REPOSITORY" ]]; then
          npm_registry="https://npm.cloudsmith.io/georgian/${NPM_REPOSITORY}/"
          {
            echo "registry=$npm_registry"
            echo "//npm.cloudsmith.io/georgian/${NPM_REPOSITORY}/:_authToken=\${CLOUDSMITH_API_KEY}"
            echo "always-auth=true"
          } > "$config_dir/npmrc"
          chmod 600 "$config_dir/npmrc"
          echo "NPM_CONFIG_USERCONFIG=$config_dir/npmrc" >> "$GITHUB_ENV"
        fi

        if [[ -n "$PYTHON_REPOSITORY" ]]; then
          python_index="https://dl.cloudsmith.io/basic/georgian/${PYTHON_REPOSITORY}/python/simple/"
          {
            echo "machine dl.cloudsmith.io"
            echo "login token"
            echo "password $CLOUDSMITH_API_KEY"
          } > "$config_dir/netrc"
          chmod 600 "$config_dir/netrc"
          echo "NETRC=$config_dir/netrc" >> "$GITHUB_ENV"
          echo "PIP_INDEX_URL=$python_index" >> "$GITHUB_ENV"
          echo "UV_INDEX_URL=$python_index" >> "$GITHUB_ENV"
          echo "UV_INDEX_USERNAME=token" >> "$GITHUB_ENV"
          echo "UV_INDEX_PASSWORD=$CLOUDSMITH_API_KEY" >> "$GITHUB_ENV"
        fi
