name: Set up Cloudsmith
description: Authenticate one repository and configure package managers.

inputs:
  npm-repository:
    description: Cloudsmith repository for npm-compatible clients.
    required: false
    default: ""
  python-repository:
    description: Cloudsmith repository for Python clients.
    required: false
    default: ""
  cooldown-bypass:
    description: >-
      Set to "true" to skip the package cooldown with this repository's
      bypass identity. The job must run in the protected cloudsmith-bypass
      environment, and each repository input must be georgian-ci-bypass.
    required: false
    default: "false"

outputs:
  service-slug:
    description: Cloudsmith service slug used by this job.
    value: ${{ steps.identity.outputs.service-slug }}

runs:
  using: composite
  steps:
    - name: Select the repository identity
      id: identity
      shell: bash
      env:
        COOLDOWN_BYPASS: ${{ inputs.cooldown-bypass }}
      run: |
        set -euo pipefail
        # Cloudsmith trusts the ci-bypass- identity only for a token with the
        # cloudsmith-bypass environment claim, so a job outside that approved
        # environment fails here at authentication.
        case "$COOLDOWN_BYPASS" in
          false) prefix="ci-pull" ;;
          true) prefix="ci-bypass" ;;
          *)
            echo "cooldown-bypass must be true or false." >&2
            exit 1
            ;;
        esac
        repository="${GITHUB_REPOSITORY#*/}"
        candidate="${prefix}-${repository,,}"
        candidate="$(printf '%s' "$candidate" | tr -cs 'a-z0-9-' '-' | sed 's/^-//;s/-$//')"
        if (( ${#candidate} > 64 )); then
          digest="$(printf '%s' "$candidate" | sha256sum | cut -c1-8)"
          candidate="${candidate:0:55}"
          while [[ "$candidate" == *- ]]; do
            candidate="${candidate%-}"
          done
          candidate="${candidate}-${digest}"
        fi
        service_slug="$candidate"
        if [[ ! "$service_slug" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]; then
          echo "Invalid Cloudsmith service slug: $service_slug" >&2
          exit 1
        fi
        echo "service-slug=$service_slug" >> "$GITHUB_OUTPUT"

    - name: Authenticate to Cloudsmith
      uses: cloudsmith-io/cloudsmith-cli-action@69e169e2ad9bc9a1599c2dff464061a00fe9f8ba # v3.1.1
      with:
        cli-version: "1.27.0"
        oidc-namespace: georgian
        oidc-service-slug: ${{ steps.identity.outputs.service-slug }}
        export-auth-token: "true"

    - name: Configure package clients
      shell: bash
      env:
        NPM_REPOSITORY: ${{ inputs.npm-repository }}
        PYTHON_REPOSITORY: ${{ inputs.python-repository }}
        COOLDOWN_BYPASS: ${{ inputs.cooldown-bypass }}
      run: |
        python3 "$GITHUB_ACTION_PATH/configure.py"
