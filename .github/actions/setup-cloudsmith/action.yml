name: Set up Cloudsmith
description: Authenticate one repository and configure package managers.

inputs:
  npm-repository:
    description: Cloudsmith repository for npm-compatible clients.
    required: false
    default: ""
  python-repository:
    description: Cloudsmith repository for Python clients.
    required: false
    default: ""
  cooldown-bypass:
    description: >-
      Set to "true" to skip the package cooldown with this repository's
      bypass identity. The job must run in the protected cloudsmith-bypass
      environment, and each repository input must be georgian-ci-bypass.
    required: false
    default: "false"
  cooldown-bypass-reason:
    description: >-
      Required with cooldown-bypass. One line saying why the job needs a
      version the cooldown hides. It is shown on the run and in the job
      summary, next to GitHub's record of who approved the run.
    required: false
    default: ""
  cooldown-bypass-packages:
    description: >-
      Required with cooldown-bypass. The exact versions the job needs, one
      name@version per line. Use the same reason and list in an earlier
      cloudsmith-bypass-request job, so the reviewer sees them before approving.
    required: false
    default: ""

outputs:
  service-slug:
    description: Cloudsmith service slug used by this job.
    value: ${{ steps.identity.outputs.service-slug }}

runs:
  using: composite
  steps:
    - name: Select the repository identity
      id: identity
      shell: bash
      env:
        COOLDOWN_BYPASS: ${{ inputs.cooldown-bypass }}
      run: python3 "$GITHUB_ACTION_PATH/configure.py" identity

    - name: Authenticate to Cloudsmith
      uses: cloudsmith-io/cloudsmith-cli-action@69e169e2ad9bc9a1599c2dff464061a00fe9f8ba # v3.1.1
      with:
        cli-version: "1.27.0"
        oidc-namespace: georgian
        oidc-service-slug: ${{ steps.identity.outputs.service-slug }}
        export-auth-token: "true"

    - name: Configure package clients
      shell: bash
      env:
        NPM_REPOSITORY: ${{ inputs.npm-repository }}
        PYTHON_REPOSITORY: ${{ inputs.python-repository }}
        COOLDOWN_BYPASS: ${{ inputs.cooldown-bypass }}
        COOLDOWN_BYPASS_REASON: ${{ inputs.cooldown-bypass-reason }}
        COOLDOWN_BYPASS_PACKAGES: ${{ inputs.cooldown-bypass-packages }}
      run: python3 "$GITHUB_ACTION_PATH/configure.py" configure
